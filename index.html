<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1026">
    <title>خونه گل‌ها • یاسین و آیدا</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/story.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="book-container">
        <header class="story-header">
            <div>
                <div class="eyebrow">STORYBOOK • YASIN × AYDA</div>
                <h1>خونه گل‌ها و رُزا (ترسناک)</h1>
                <p>یه خونه قدیمی، پر از گل و ترس واقعی</p>
            </div>
            <div class="controls">
                <button id="audio-toggle" title="موسیقی پس زمینه">🎵 موسیقی</button>
                <button id="restart-btn" title="شروع دوباره">برو از اول</button>
            </div>
        </header>

        <div class="progress-area">
            <div class="progress-label"><span id="chapter-label">شروع</span><span id="progress-percent">۸٪</span></div>
            <div class="progress-bar-container"><div id="progress-bar" class="progress-bar"></div></div>
        </div>

        <main id="story-viewport" class="story-viewport"></main>

        <footer class="story-footer">
            <button id="prev-btn" class="nav-btn secondary">→ قبلی</button>
            <div class="page-counter"><span id="page-indicator">صفحه ۱ از ۱۲</span></div>
            <button id="next-btn" class="nav-btn">بعدی ←</button>
        </footer>
    </div>

    <script src="js/story.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
