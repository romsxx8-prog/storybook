<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="flicker" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#room)"/>
  <ellipse cx="800" cy="180" rx="400" ry="250" fill="url(#flicker)"/>
  <!-- ceiling lamp -->
  <circle cx="800" cy="120" r="40" fill="#fde68a" opacity="0.9"/>
  <circle cx="800" cy="120" r="60" fill="#fef08a" opacity="0.3"/>
  <line x1="800" y1="40" x2="800" y2="100" stroke="#a8a29e" stroke-width="4"/>
  <!-- floor -->
  <rect x="0" y="720" width="1600" height="180" fill="#1c1917"/>
  <!-- table -->
  <rect x="550" y="580" width="500" height="25" rx="4" fill="#44403c"/>
  <rect x="580" y="605" width="30" height="115" fill="#292524"/>
  <rect x="990" y="605" width="30" height="115" fill="#292524"/>
  <!-- rose on table -->
  <circle cx="800" cy="540" r="28" fill="#e11d48"/>
  <circle cx="790" cy="530" r="12" fill="#be123c"/>
  <line x1="800" y1="565" x2="800" y2="595" stroke="#166534" stroke-width="5"/>
  <ellipse cx="810" cy="555" rx="18" ry="10" fill="#166534" opacity="0.8"/>
  <!-- soft light rays -->
  <g opacity="0.25" stroke="#fef08a" stroke-width="2">
    <line x1="800" y1="160" x2="500" y2="500"/>
    <line x1="800" y1="160" x2="1100" y2="500"/>
    <line x1="800" y1="160" x2="700" y2="550"/>
    <line x1="800" y1="160" x2="900" y2="550"/>
  </g>
  <!-- walls hint -->
  <rect x="0" y="0" width="80" height="900" fill="#0f172a" opacity="0.5"/>
  <rect x="1520" y="0" width="80" height="900" fill="#0f172a" opacity="0.5"/>
</svg>
