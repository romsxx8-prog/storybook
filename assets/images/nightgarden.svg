<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="moonlight" cx="75%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#night)"/>
  <ellipse cx="1200" cy="140" rx="400" ry="280" fill="url(#moonlight)"/>
  <!-- moon -->
  <circle cx="1280" cy="120" r="55" fill="#f0f9ff"/>
  <circle cx="1260" cy="105" r="50" fill="#020617"/>
  <!-- stars -->
  <g fill="#e0f2fe">
    <circle cx="200" cy="80" r="2"/><circle cx="350" cy="150" r="1.5"/><circle cx="500" cy="60" r="2"/>
    <circle cx="700" cy="110" r="1.5"/><circle cx="900" cy="50" r="2"/><circle cx="1050" cy="180" r="1.5"/>
    <circle cx="200" cy="200" r="1"/><circle cx="450" cy="220" r="1.5"/>
  </g>
  <!-- garden ground -->
  <path d="M0 580 Q400 540 800 570 T1600 550 L1600 900 L0 900 Z" fill="#052e16"/>
  <!-- glowing flowers -->
  <g>
    <circle cx="280" cy="620" r="20" fill="#f43f5e" opacity="0.9"/><circle cx="280" cy="620" r="30" fill="#f43f5e" opacity="0.25"/>
    <circle cx="350" cy="600" r="16" fill="#a855f7" opacity="0.9"/><circle cx="350" cy="600" r="26" fill="#a855f7" opacity="0.25"/>
    <circle cx="720" cy="640" r="22" fill="#ec4899" opacity="0.9"/><circle cx="720" cy="640" r="34" fill="#ec4899" opacity="0.2"/>
    <circle cx="800" cy="610" r="18" fill="#22d3ee" opacity="0.9"/><circle cx="800" cy="610" r="28" fill="#22d3ee" opacity="0.25"/>
    <circle cx="1100" cy="630" r="19" fill="#fbbf24" opacity="0.9"/><circle cx="1100" cy="630" r="30" fill="#fbbf24" opacity="0.25"/>
    <circle cx="1180" cy="600" r="15" fill="#f43f5e" opacity="0.9"/><circle cx="1180" cy="600" r="24" fill="#f43f5e" opacity="0.25"/>
    <circle cx="450" cy="650" r="14" fill="#c084fc" opacity="0.85"/>
    <circle cx="950" cy="660" r="17" fill="#f9a8d4" opacity="0.85"/>
  </g>
  <!-- blanket / sitting area suggestion -->
  <ellipse cx="800" cy="720" rx="180" ry="40" fill="#1e1b4b" opacity="0.7"/>
  <!-- soft petals in air -->
  <g opacity="0.5">
    <ellipse cx="600" cy="350" rx="10" ry="6" fill="#f9a8d4" transform="rotate(25)"/>
    <ellipse cx="1000" cy="280" rx="9" ry="5" fill="#c4b5fd" transform="rotate(-20)"/>
  </g>
</svg>
