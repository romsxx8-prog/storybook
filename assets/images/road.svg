<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roadgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dusk)"/>
  <!-- distant hills -->
  <path d="M0 400 Q300 320 600 380 T1200 340 T1600 400 L1600 900 L0 900 Z" fill="#1e293b"/>
  <!-- road -->
  <path d="M600 900 L750 450 L850 450 L1000 900 Z" fill="url(#roadgrad)"/>
  <path d="M780 450 L820 450" stroke="#fbbf24" stroke-width="4" stroke-dasharray="20 15" opacity="0.6"/>
  <!-- car silhouette -->
  <rect x="720" y="520" width="160" height="50" rx="12" fill="#334155"/>
  <rect x="740" y="490" width="120" height="40" rx="8" fill="#475569"/>
  <circle cx="750" cy="575" r="18" fill="#0f172a"/><circle cx="850" cy="575" r="18" fill="#0f172a"/>
  <!-- soft sky colors -->
  <ellipse cx="400" cy="200" rx="200" ry="80" fill="#f9a8d4" opacity="0.15"/>
  <ellipse cx="1200" cy="180" rx="180" ry="70" fill="#a5b4fc" opacity="0.15"/>
  <!-- few stars -->
  <circle cx="200" cy="100" r="2" fill="#e0f2fe"/><circle cx="1400" cy="80" r="1.5" fill="#e0f2fe"/>
  <circle cx="900" cy="60" r="2" fill="#e0f2fe"/>
</svg>
