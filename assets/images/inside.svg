<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <ellipse cx="800" cy="200" rx="500" ry="300" fill="url(#lamp)"/>
  <!-- floor -->
  <rect x="0" y="700" width="1600" height="200" fill="#1c120b"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#44403c" stroke-width="3"/>
  <!-- wooden panel lines -->
  <g stroke="#44403c" stroke-width="2" opacity="0.4">
    <line x1="0" y1="200" x2="1600" y2="200"/><line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
  </g>
  <!-- photo frame -->
  <rect x="680" y="220" width="240" height="300" rx="6" fill="#292524" stroke="#a8a29e" stroke-width="8"/>
  <rect x="700" y="240" width="200" height="240" fill="#1e293b"/>
  <!-- silhouette of woman -->
  <ellipse cx="800" cy="320" rx="45" ry="55" fill="#94a3b8"/>
  <path d="M740 420 Q800 380 860 420 L860 480 L740 480 Z" fill="#94a3b8"/>
  <!-- soft glow around photo -->
  <rect x="680" y="220" width="240" height="300" rx="6" fill="none" stroke="#f9a8d4" stroke-width="2" opacity="0.4"/>
  <!-- side table -->
  <rect x="200" y="620" width="180" height="20" rx="4" fill="#44403c"/>
  <rect x="220" y="640" width="20" height="60" fill="#292524"/>
  <rect x="340" y="640" width="20" height="60" fill="#292524"/>
  <!-- small vase with flower -->
  <ellipse cx="290" cy="610" rx="25" ry="15" fill="#166534"/>
  <circle cx="290" cy="580" r="18" fill="#ec4899"/>
  <line x1="290" y1="595" x2="290" y2="620" stroke="#166534" stroke-width="4"/>
  <!-- window light -->
  <rect x="1200" y="180" width="220" height="280" rx="4" fill="#0f172a" stroke="#57534e" stroke-width="6"/>
  <rect x="1220" y="200" width="80" height="110" fill="#1e3a5f" opacity="0.6"/>
  <rect x="1320" y="200" width="80" height="110" fill="#1e3a5f" opacity="0.6"/>
  <rect x="1220" y="330" width="80" height="110" fill="#1e3a5f" opacity="0.5"/>
  <rect x="1320" y="330" width="80" height="110" fill="#1e3a5f" opacity="0.5"/>
</svg>
