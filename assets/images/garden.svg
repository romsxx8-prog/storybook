<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="sun" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#gsky)"/>
  <ellipse cx="1100" cy="180" rx="300" ry="200" fill="url(#sun)"/>
  <!-- grass -->
  <path d="M0 500 Q400 460 800 490 T1600 470 L1600 900 L0 900 Z" fill="#14532d"/>
  <path d="M0 620 Q300 580 600 610 T1200 590 T1600 620 L1600 900 L0 900 Z" fill="#166534"/>
  <!-- flower beds -->
  <g>
    <!-- left cluster -->
    <circle cx="220" cy="580" r="22" fill="#f43f5e"/><circle cx="260" cy="560" r="18" fill="#ec4899"/>
    <circle cx="200" cy="540" r="16" fill="#a855f7"/><circle cx="290" cy="590" r="14" fill="#fbbf24"/>
    <circle cx="240" cy="620" r="15" fill="#22d3ee"/><circle cx="310" cy="550" r="13" fill="#f43f5e"/>
    <!-- center -->
    <circle cx="780" cy="540" r="24" fill="#ec4899"/><circle cx="830" cy="520" r="20" fill="#a855f7"/>
    <circle cx="750" cy="510" r="17" fill="#fbbf24"/><circle cx="870" cy="550" r="15" fill="#f43f5e"/>
    <circle cx="800" cy="580" r="18" fill="#22d3ee"/><circle cx="720" cy="560" r="14" fill="#ec4899"/>
    <!-- right -->
    <circle cx="1280" cy="570" r="21" fill="#a855f7"/><circle cx="1330" cy="550" r="19" fill="#f43f5e"/>
    <circle cx="1250" cy="530" r="16" fill="#fbbf24"/><circle cx="1370" cy="580" r="14" fill="#22d3ee"/>
    <circle cx="1310" cy="600" r="17" fill="#ec4899"/>
  </g>
  <!-- stems -->
  <g stroke="#166534" stroke-width="3" fill="none">
    <line x1="220" y1="600" x2="220" y2="680"/><line x1="260" y1="580" x2="260" y2="680"/>
    <line x1="780" y1="560" x2="780" y2="680"/><line x1="830" y1="540" x2="830" y2="680"/>
    <line x1="1280" y1="590" x2="1280" y2="680"/><line x1="1330" y1="570" x2="1330" y2="680"/>
  </g>
  <!-- old fence -->
  <g stroke="#78350f" stroke-width="6" fill="none" opacity="0.7">
    <line x1="100" y1="700" x2="1500" y2="700"/>
    <line x1="200" y1="650" x2="200" y2="750"/><line x1="400" y1="650" x2="400" y2="750"/>
    <line x1="600" y1="650" x2="600" y2="750"/><line x1="800" y1="650" x2="800" y2="750"/>
    <line x1="1000" y1="650" x2="1000" y2="750"/><line x1="1200" y1="650" x2="1200" y2="750"/>
    <line x1="1400" y1="650" x2="1400" y2="750"/>
  </g>
  <!-- soft petals floating -->
  <g opacity="0.6">
    <ellipse cx="450" cy="300" rx="12" ry="8" fill="#f9a8d4" transform="rotate(20 450 300)"/>
    <ellipse cx="900" cy="250" rx="10" ry="7" fill="#c4b5fd" transform="rotate(-15 900 250)"/>
    <ellipse cx="1100" cy="320" rx="11" ry="8" fill="#fde68a" transform="rotate(30 1100 320)"/>
  </g>
</svg>
